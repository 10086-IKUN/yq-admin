server:
  port: 8080
  servlet:
    context-path: /yq-admin

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB


  data:
    redis:
      lettuce:
        pool:
          max-active: 8            # 最大连接数
          max-idle: 8              # 最大空闲连接
          min-idle: 0              # 最小空闲连接
          max-wait: 2000ms         # 获取连接最大等待时间

mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    map-underscore-to-camel-case: true
  mapper-locations: classpath*:/mapper/**/*.xml

oss:
  endpoint: oss-cn-beijing.aliyuncs.com
  bucket: yq-homework
  access-key-id: ${ALIYUN_OSS_ACCESS_KEY_ID:}
  access-key-secret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
  dir-prefix: homework
  preview-expire-minutes: 10
  max-file-size-mb: 50

yanque:
  ai-chat:
    base-url: ${YANQUE_AI_BASE_URL:http://localhost:8000}
    stream-path: /api/ai-chat/stream
    connect-timeout-seconds: 5
    response-timeout-seconds: 180
    history-limit: 20
